openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
security:
  - BearerAuth: []
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Housing operations overview
  - name: residents
    description: Resident records
  - name: payments
    description: Resident payment records
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get operations dashboard
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /residents:
    get:
      operationId: listResidents
      tags: [residents]
      summary: List residents
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all, active, pending, exited]
      responses:
        "200":
          description: Resident list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resident"
    post:
      operationId: createResident
      tags: [residents]
      summary: Add a resident
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResidentInput"
      responses:
        "201":
          description: Resident created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resident"
  /residents/{id}:
    get:
      operationId: getResident
      tags: [residents]
      summary: Get a resident
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Resident record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resident"
        "404":
          description: Resident not found
    patch:
      operationId: updateResident
      tags: [residents]
      summary: Update a resident
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResidentUpdate"
      responses:
        "200":
          description: Resident updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resident"
  /payments:
    get:
      operationId: listPayments
      tags: [payments]
      summary: List payments
      security:
        - BearerAuth: []
      parameters:
        - name: residentId
          in: query
          required: false
          schema:
            type: number
            multipleOf: 1
            minimum: 1
            maximum: 2147483647
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all, paid, due, overdue]
      responses:
        "200":
          description: Payment list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"
    post:
      operationId: createPayment
      tags: [payments]
      summary: Record a payment
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "201":
          description: Payment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
  /activity:
    get:
      operationId: listActivity
      tags: [dashboard]
      summary: Get recent activity
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
  /reports/{reportType}/export:
    get:
      operationId: exportReport
      tags: [reports]
      summary: Export an approved report
      description: Administrator-only CSV or PDF export. The server records the actor and timestamp in the audit history.
      security:
        - BearerAuth: []
      parameters:
        - name: reportType
          in: path
          required: true
          schema:
            type: string
            enum: [occupancy, roster, payments, revenue, compliance, referral, audit]
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [csv, pdf]
      responses:
        "200":
          description: Report file
          content:
            text/csv: { schema: { type: string } }
            application/pdf: { schema: { type: string, format: binary } }
        "403": { description: Administrator access required }
        "404": { description: No report data available }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: signed-session
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: number
        multipleOf: 1
        minimum: 1
        maximum: 2147483647
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Dashboard:
      type: object
      required: [activeResidents, bedsAvailable, paymentsDue, paymentsCollected, occupancyRate]
      properties:
        activeResidents: { type: number }
        bedsAvailable: { type: number }
        paymentsDue: { type: number }
        paymentsCollected: { type: number }
        occupancyRate: { type: number }
        statusCounts:
          type: object
          additionalProperties: { type: number }
    Resident:
      type: object
      required: [id, name, email, phone, home, moveInDate, status, balance, nextPaymentDate]
      properties:
        id: { type: number }
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        home: { type: string }
        moveInDate: { type: string }
        status: { type: string, enum: [active, pending, exited] }
        balance: { type: number }
        nextPaymentDate: { type: string }
        notes: { type: ["string", "null"] }
    ResidentInput:
      type: object
      required: [name, email, phone, home, moveInDate]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string }
        phone: { type: string }
        home: { type: string }
        moveInDate: { type: string }
        status: { type: string, enum: [active, pending, exited] }
        notes: { type: string }
    ResidentUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string }
        phone: { type: string }
        home: { type: string }
        moveInDate: { type: string }
        status: { type: string, enum: [active, pending, exited] }
        notes: { type: string }
    Payment:
      type: object
      additionalProperties: false
      required: [id, residentId, residentName, amount, dueDate, paidDate, status, method]
      properties:
        id: { type: number, multipleOf: 1, minimum: 1, maximum: 2147483647 }
        residentId: { type: number, multipleOf: 1, minimum: 1, maximum: 2147483647 }
        residentName: { type: string }
        amount: { type: number, minimum: 0, maximum: 99999999.99, multipleOf: 0.01 }
        dueDate: { type: string, format: date }
        paidDate: { type: ["string", "null"], format: date }
        status: { type: string, enum: [paid, due, overdue] }
        method: { type: ["string", "null"], maxLength: 80 }
    PaymentInput:
      type: object
      additionalProperties: false
      required: [residentId, amount, dueDate]
      properties:
        residentId: { type: number, multipleOf: 1, minimum: 1, maximum: 2147483647 }
        # Decimal text avoids binary floating-point rounding before the server
        # stores the value in PostgreSQL numeric(10, 2).
        amount:
          type: string
          minLength: 1
          maxLength: 11
          pattern: '^(0|[1-9][0-9]{0,7})(\.[0-9]{1,2})?$'
          description: Non-negative USD amount with at most two decimal places.
        dueDate: { type: string, format: date }
        paidDate: { type: string, format: date }
        method: { type: string, maxLength: 80 }
    Activity:
      type: object
      required: [id, type, title, detail, timestamp]
      properties:
        id: { type: number }
        type: { type: string, enum: [resident, payment, note] }
        title: { type: string }
        detail: { type: string }
        timestamp: { type: string }

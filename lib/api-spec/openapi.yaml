openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
security:
  - BearerAuth: []
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Housing operations overview
  - name: residents
    description: Resident records
  - name: payments
    description: Resident payment records
  - name: finances
    description: Organization financial records
  - name: meetings
    description: Program meeting attendance
  - name: houses
    description: Recovery housing locations
  - name: reports
    description: Scoped operational reports and exports
  - name: resident-import
    description: Safe resident imports
  - name: assessments
    description: Versioned resident assessments
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: readinessCheck
      tags: [health]
      summary: Readiness check
      description: Reports whether PostgreSQL and shared request-protection infrastructure can serve application traffic.
      security: []
      responses:
        "200":
          description: Dependencies are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          description: One or more dependencies are unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
  /auth/session:
    get:
      operationId: getSession
      tags: [health]
      summary: Verify the current browser session
      description: Returns only the safe identity and scope needed to render the authenticated workspace. Session credentials remain in an HttpOnly cookie.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Authenticated browser session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: Session is missing, expired, or revoked
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get operations dashboard
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Month"
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /residents:
    get:
      operationId: listResidents
      tags: [residents]
      summary: List residents
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all, active, pending, exited]
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageOffset"
      responses:
        "200":
          description: Resident list
          headers:
            X-Page-Limit:
              $ref: "#/components/headers/PageLimit"
            X-Page-Offset:
              $ref: "#/components/headers/PageOffset"
            X-Has-More:
              $ref: "#/components/headers/HasMore"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resident"
    post:
      operationId: createResident
      tags: [residents]
      summary: Add a resident
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResidentInput"
      responses:
        "201":
          description: Resident created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resident"
  /residents/{id}:
    get:
      operationId: getResident
      tags: [residents]
      summary: Get a resident
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Resident record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resident"
        "404":
          description: Resident not found
    patch:
      operationId: updateResident
      tags: [residents]
      summary: Update a resident
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResidentUpdate"
      responses:
        "200":
          description: Resident updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resident"
  /assessment-templates:
    get:
      operationId: listAssessmentTemplates
      tags: [assessments]
      summary: List assessment template versions available to the caller
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Assessment template catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssessmentTemplate"
        "403": { description: Assessment access denied }
  /assessment-templates/{id}:
    get:
      operationId: getAssessmentTemplate
      tags: [assessments]
      summary: Preview an assessment template version
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Assessment template version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentTemplate"
        "403": { description: Assessment access denied }
        "404": { description: Assessment template not found }
  /assessment-templates/{id}/revisions:
    post:
      operationId: createAssessmentRevision
      tags: [assessments]
      summary: Create a draft assessment revision
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentRevisionInput"
      responses:
        "201":
          description: Draft assessment revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentTemplate"
        "400": { description: Invalid assessment revision }
        "403": { description: Administrator access required }
        "404": { description: Source template not found }
  /assessment-templates/{id}/publish:
    post:
      operationId: publishAssessmentTemplate
      tags: [assessments]
      summary: Publish a draft assessment revision
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Published assessment template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentTemplate"
        "400": { description: Only draft revisions can be published }
        "403": { description: Administrator access required }
        "404": { description: Assessment template not found }
  /assessment-templates/{id}/retire:
    post:
      operationId: retireAssessmentTemplate
      tags: [assessments]
      summary: Retire an assessment template version
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Retired assessment template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentTemplate"
        "400": { description: Assessment template already retired }
        "403": { description: Administrator access required }
        "404": { description: Assessment template not found }
  /residents/{id}/assessments:
    get:
      operationId: listResidentAssessments
      tags: [assessments]
      summary: List assessments for a resident
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageOffset"
      responses:
        "200":
          description: Resident assessment list
          headers:
            X-Page-Limit:
              $ref: "#/components/headers/PageLimit"
            X-Page-Offset:
              $ref: "#/components/headers/PageOffset"
            X-Has-More:
              $ref: "#/components/headers/HasMore"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssessmentSummary"
        "403": { description: Assessment access denied }
        "404": { description: Resident not found }
    post:
      operationId: createResidentAssessment
      tags: [assessments]
      summary: Start or assign an assessment for a resident
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentStartInput"
      responses:
        "201":
          description: Assessment draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentDetail"
        "403": { description: Assessment access denied }
        "404": { description: Resident or template not found }
  /assessments/{id}:
    get:
      operationId: getAssessment
      tags: [assessments]
      summary: Read an assessment draft or submission
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Assessment detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentDetail"
        "403": { description: Assessment access denied }
        "404": { description: Assessment not found }
    patch:
      operationId: updateAssessmentDraft
      tags: [assessments]
      summary: Save draft answers
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentAnswersInput"
      responses:
        "200":
          description: Updated assessment draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentDetail"
        "400": { description: Submitted assessments cannot be edited }
        "403": { description: Assessment access denied }
        "404": { description: Assessment not found }
  /assessments/{id}/submit:
    post:
      operationId: submitAssessment
      tags: [assessments]
      summary: Validate and submit an assessment
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentAnswersInput"
      responses:
        "200":
          description: Completed assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentDetail"
        "400": { description: Required fields are missing or invalid }
        "403": { description: Assessment access denied }
        "404": { description: Assessment not found }
  /residents/import/template:
    get:
      operationId: downloadResidentImportTemplate
      tags: [resident-import]
      summary: Download a resident import template
      security:
        - BearerAuth: []
      parameters:
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [csv, xlsx]
      responses:
        "200":
          description: One-client-per-row import template
          content:
            text/csv: { schema: { type: string } }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } }
        "403": { description: Authorized staff access required }
  /residents/import/preview:
    post:
      operationId: previewResidentImport
      tags: [resident-import]
      summary: Parse and validate a resident import without saving residents
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [filename, contentBase64]
              properties:
                filename: { type: string, minLength: 1, maxLength: 255 }
                contentBase64: { type: string, minLength: 1, maxLength: 1400000 }
      responses:
        "201":
          description: Row-by-row validation preview and persisted import batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidentImportPreview"
        "400": { description: Invalid or unsupported upload }
        "403": { description: Authorized staff access required }
  /residents/import/{batchId}/confirm:
    post:
      operationId: confirmResidentImport
      tags: [resident-import]
      summary: Explicitly confirm valid resident import rows
      security:
        - BearerAuth: []
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            type: number
            multipleOf: 1
            minimum: 1
            maximum: 2147483647
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [approvedRowNumbers]
              properties:
                approvedRowNumbers:
                  type: array
                  minItems: 1
                  items: { type: number, multipleOf: 1, minimum: 2 }
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidentImportResult"
        "400": { description: No valid rows were approved }
        "403": { description: Authorized staff access required }
  /payments:
    get:
      operationId: listPayments
      tags: [payments]
      summary: List payments
      security:
        - BearerAuth: []
      parameters:
        - name: residentId
          in: query
          required: false
          schema:
            type: number
            multipleOf: 1
            minimum: 1
            maximum: 2147483647
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all, paid, due, overdue]
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageOffset"
      responses:
        "200":
          description: Payment list
          headers:
            X-Page-Limit:
              $ref: "#/components/headers/PageLimit"
            X-Page-Offset:
              $ref: "#/components/headers/PageOffset"
            X-Has-More:
              $ref: "#/components/headers/HasMore"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"
    post:
      operationId: createPayment
      tags: [payments]
      summary: Record a payment
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "201":
          description: Payment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
  /activity:
    get:
      operationId: listActivity
      tags: [dashboard]
      summary: Get recent activity
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
  /houses:
    get:
      operationId: listHouses
      tags: [houses]
      summary: List houses available to the signed-in user
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Housing locations in the caller's allowed scope
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/House"
  /expenses:
    get:
      operationId: listExpenses
      tags: [finances]
      summary: List expense records
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Month"
      responses:
        "200":
          description: Expense records for the selected month
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Expense"
        "403": { description: Administrator access required }
    post:
      operationId: createExpense
      tags: [finances]
      summary: Record an expense
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "201":
          description: Expense recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "403": { description: Administrator access required }
  /income:
    get:
      operationId: listIncome
      tags: [finances]
      summary: List categorized non-rent income
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Month"
      responses:
        "200":
          description: Categorized income records for the selected month
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IncomeRecord"
        "403": { description: Administrator access required }
    post:
      operationId: createIncome
      tags: [finances]
      summary: Record categorized non-rent income
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncomeInput"
      responses:
        "201":
          description: Income recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncomeRecord"
        "403": { description: Administrator access required }
  /meetings:
    get:
      operationId: listMeetingAttendance
      tags: [meetings]
      summary: List aggregate meeting attendance records
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Month"
      responses:
        "200":
          description: Attendance records for the selected month
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MeetingAttendance"
    post:
      operationId: createMeetingAttendance
      tags: [meetings]
      summary: Record aggregate meeting attendance
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeetingAttendanceInput"
      responses:
        "201":
          description: Meeting attendance recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingAttendance"
  /reports/{reportType}/export:
    get:
      operationId: exportReport
      tags: [reports]
      summary: Export an approved report
      description: Administrator-only CSV or PDF export. The server records the actor and timestamp in the audit history.
      security:
        - BearerAuth: []
      parameters:
        - name: reportType
          in: path
          required: true
          schema:
            type: string
            enum: [occupancy, roster, payments, revenue, compliance, referral, audit]
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [csv, pdf]
      responses:
        "200":
          description: Report file
          content:
            text/csv: { schema: { type: string } }
            application/pdf: { schema: { type: string, format: binary } }
        "403": { description: Administrator access required }
        "404": { description: No report data available }
  /reports/{reportType}:
    get:
      operationId: getReport
      tags: [reports]
      summary: View a scoped operational report
      security:
        - BearerAuth: []
      parameters:
        - name: reportType
          in: path
          required: true
          schema:
            type: string
            enum: [occupancy, roster, payments, revenue, compliance, referral, audit]
        - name: house
          in: query
          required: false
          schema: { type: string, maxLength: 256 }
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "200":
          description: Scoped report rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "403": { description: Staff report access required }
        "404": { description: No matching report data }
components:
  headers:
    PageLimit:
      description: Maximum records returned for this page.
      schema:
        type: integer
    PageOffset:
      description: Number of ordered records skipped for this page.
      schema:
        type: integer
    HasMore:
      description: Whether another page exists after this page.
      schema:
        type: boolean
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: signed-session
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: number
        multipleOf: 1
        minimum: 1
        maximum: 2147483647
    Month:
      name: month
      in: query
      required: false
      description: Calendar month used for monthly totals, in YYYY-MM format. Defaults to the current UTC month.
      schema:
        type: string
        pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
    PageLimit:
      name: limit
      in: query
      required: false
      description: Maximum records to return. Defaults to 100 and cannot exceed 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
    PageOffset:
      name: offset
      in: query
      required: false
      description: Number of stable, ordered records to skip before returning this page.
      schema:
        type: integer
        minimum: 0
        maximum: 10000
        default: 0
  schemas:
    Session:
      type: object
      required: [authenticated, user, expiresAt]
      properties:
        authenticated:
          type: boolean
          const: true
        user:
          type: object
          required: [id, role, organizationId, houseNames]
          properties:
            id: { type: string, minLength: 1, maxLength: 256 }
            role:
              type: string
              enum: [owner_admin, program_director, house_manager, resident]
            organizationId: { type: string, minLength: 1, maxLength: 256 }
            houseNames:
              type: array
              items: { type: string, maxLength: 256 }
            residentId:
              type: number
              multipleOf: 1
              minimum: 1
        expiresAt:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ReadinessStatus:
      type: object
      required: [status, dependencies]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        dependencies:
          type: object
          required: [database, rateLimitStore]
          properties:
            database:
              type: string
              enum: [ok, unavailable]
            rateLimitStore:
              type: string
              enum: [ok, unavailable]
        correlationId:
          type: string
          minLength: 1
          maxLength: 128
          description: Present when readiness fails so operators can correlate the response with safe server logs.
    Dashboard:
      type: object
      required: [activeResidents, bedsAvailable, paymentsDue, paymentsCollected, occupancyRate, period, week, capacity, income, expenses, meetings, weeklyAttendance, weeklyMeetings, dataQuality, progress]
      properties:
        activeResidents: { type: number }
        bedsAvailable: { type: number }
        paymentsDue: { type: number }
        paymentsCollected: { type: number }
        occupancyRate: { type: number }
        statusCounts:
          type: object
          additionalProperties: { type: number }
        period:
          type: object
          required: [month, startsOn, endsOn]
          properties:
            month: { type: string }
            startsOn: { type: string, format: date }
            endsOn: { type: string, format: date }
        capacity:
          type: object
          required: [totalBeds, occupiedBeds, bedsAvailable, occupancyRate]
          properties:
            totalBeds: { type: number }
            occupiedBeds: { type: number }
            bedsAvailable: { type: number }
            occupancyRate: { type: number }
        income:
          type: object
          required: [rentCollected, otherIncome, totalReceived]
          properties:
            rentCollected: { type: number }
            otherIncome: { type: number }
            totalReceived: { type: number }
        expenses:
          type: object
          required: [total, categories]
          properties:
            total: { type: number }
            categories:
              type: array
              items:
                $ref: "#/components/schemas/ExpenseCategoryTotal"
        meetings:
          type: object
          required: [meetingsLogged, womenAttended, womenEligible, attendanceRate]
          properties:
            meetingsLogged: { type: number }
            womenAttended: { type: number }
            womenEligible: { type: number }
            attendanceRate: { type: ["number", "null"] }
        week:
          $ref: "#/components/schemas/DashboardWeek"
        weeklyAttendance:
          type: array
          items:
            $ref: "#/components/schemas/WeeklyAttendance"
        weeklyMeetings:
          $ref: "#/components/schemas/DashboardMeetings"
        dataQuality:
          $ref: "#/components/schemas/DashboardDataQuality"
        progress:
          type: object
          required: [newMoveIns, completedOperations]
          properties:
            newMoveIns: { type: number }
            completedOperations: { type: number }
    WeeklyAttendance:
      type: object
      required: [weekStart, weekEnd, meetingsLogged, womenAttended, womenEligible, attendanceRate]
      properties:
        weekStart: { type: string, format: date }
        weekEnd: { type: string, format: date }
        meetingsLogged: { type: number }
        womenAttended: { type: number }
        womenEligible: { type: number }
        attendanceRate: { type: ["number", "null"] }
    DataQualitySummary:
      type: object
      required: [overall, issueCount, checks]
      properties:
        overall:

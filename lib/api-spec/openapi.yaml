      type: object
      additionalProperties: false
      required: [residentId, amount, dueDate]
      properties:
        residentId: { type: number, multipleOf: 1, minimum: 1, maximum: 2147483647 }
        # Decimal text avoids binary floating-point rounding before the server
        # stores the value in PostgreSQL numeric(10, 2).
        amount:
          type: string
          minLength: 1
          maxLength: 11
          pattern: '^(0|[1-9][0-9]{0,7})(\.[0-9]{1,2})?$'
          description: Non-negative USD amount with at most two decimal places.
        dueDate: { type: string, format: date }
        paidDate: { type: string, format: date }
        method: { type: string, maxLength: 80 }

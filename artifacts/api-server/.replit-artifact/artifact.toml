kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# Replit Publish applies the reviewed development-to-production schema diff.
# Startup must only start the API; it must not perform a second migration path.
args = ["pnpm", "--filter", "@workspace/api-server", "run", "start"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"
DB_SSL = "true"
CORS_ORIGINS = "https://redeemerhouse.replit.app,https://app.redeemerhouse.com"
API_RATE_LIMIT_STORE = "postgres"
TRUST_PROXY = "true"

[services.production.health.startup]
path = "/api/healthz"
